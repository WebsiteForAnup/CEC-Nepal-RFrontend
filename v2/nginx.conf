# Include this server block from nginx's http context, for example through
# /etc/nginx/sites-enabled/cec-v2 or /etc/nginx/conf.d/cec-v2.conf.
# Update server_name and root for your deployment.
# Build: npm --prefix v2 run build
# Start the SSR server under a process manager: npm --prefix v2 start
# The SSR server defaults to 127.0.0.1:3001; match proxy_pass to PORT if changed.
# This is an HTTP configuration. Configure your certificate and HTTPS listener
# on the deployment host before using authentication in production.

server {
    listen 80;
    listen [::]:80;
    server_name test.cecnepal.com.np;

    root /home/anupadkh/deploy/CEC-Nepal-RFrontend/v2/dist/client;
    autoindex off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/geo+json application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Keep certificate challenges accessible while hiding other dotfiles.
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    # This endpoint belongs to the development server only.
    location = /b2-proxy {
        return 404;
    }

    location ^~ /b2-proxy/ {
        return 404;
    }

    # Vite names built assets with content hashes, so they can be cached long term.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    # Public files keep their original names; use a shorter cache lifetime.
    location ~* \.(?:css|js|mjs|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|pdf|geojson|json|xml|txt)$ {
        try_files $uri =404;
        expires 1h;
    }

    # Every page, including nested admin and project routes, is rendered by Node.
    # Do not fall back to index.html: it is an SSR template, not a rendered page.
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_cache off;
    }
}
