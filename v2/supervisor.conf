; Install as /etc/supervisor/conf.d/cec-v2.conf on Ubuntu/Debian.
; Update directory, command and user to match your deployment host.
; Run Node directly so Supervisor tracks the SSR process itself.
[program:cec-v2]
directory=/var/www/cec-nepal/v2
command=/usr/bin/node server.mjs --production
user=www-data
environment=NODE_ENV="production",PORT="3001"
autostart=true
autorestart=true
startsecs=5
startretries=3
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/cec-v2.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
