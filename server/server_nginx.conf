server {
    server_name cecnepal.com.np  www.cecnepal.com.np cecnepal.anup.pro.np;

    access_log /home/anupadkh/logs/nginx/cec/cec_access.log;
    error_log /home/anupadkh/logs/nginx/cec/cec_error.log ;
    
    root /home/anupadkh/deploy/cec/docs;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The b2-universal-proxy equivalent
location /b2-proxy {
    # 1. Handle CORS Headers
    # Emulates: req.headers.origin || '*'
    set $cors_origin "*";
    if ($http_origin ~* ".+") {
        set $cors_origin $http_origin;
    }

    add_header 'Access-Control-Allow-Origin' $cors_origin always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, HEAD, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' '*' always;
    add_header 'Access-Control-Max-Age' '3600' always;

    # 2. Handle OPTIONS Preflight
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # 3. Target URL Validation
    # Checks if X-B2-Target-URL header exists and is not empty
    if ($http_x_b2_target_url = "") {
        return 400 '{"error": "Missing X-B2-Target-URL header"}';
    }

    # 4. Strip / Header Filtering
    # Nginx strips Host, Connection, and Hop-by-Hop headers automatically.
    # We explicitly clear Vite's skipped browser-specific headers.
    proxy_set_header Origin "";
    proxy_set_header Referer "";
    proxy_set_header Cookie "";
    proxy_set_header Sec-Fetch-Site "";
    proxy_set_header Sec-Fetch-Mode "";
    proxy_set_header Sec-Fetch-Dest "";
    proxy_set_header Sec-Fetch-User "";
    proxy_set_header Priority "";
    proxy_set_header Upgrade-Insecure-Requests "";
    proxy_set_header X-B2-Target-URL ""; # Strip the target header before forwarding

    # Pass along authentic headers like Content-Type or Authorization if present
    proxy_pass_request_headers on;

    # 5. Dynamic Reverse Proxy Forwarding
    # resolver is REQUIRED when using a variable in proxy_pass
    # Using Google's public DNS here; change to your preferred DNS if needed.
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    proxy_pass $http_x_b2_target_url;

    # 6. Error Handling
    # Catch 502/bad gateways to return a JSON error instead of Nginx HTML page
    error_page 502 504 = @proxy_error;
}

# Named location for custom JSON error formatting
location @proxy_error {
    default_type application/json;
    return 502 '{"error": "B2 proxy upstream error: Bad Gateway or Timeout"}';
}

    # Cache static assets
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";










    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/cecnepal.com.np/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/cecnepal.com.np/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot



}

server {
    if ($host = cecnepal.anup.pro.np) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = www.cecnepal.com.np) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = cecnepal.com.np) {
        return 301 https://$host$request_uri;
    } # managed by Certbot



    listen 80;
    listen [::]:80;
    server_name cecnepal.com.np  www.cecnepal.com.np cecnepal.anup.pro.np;
    return 404; # managed by Certbot






}
